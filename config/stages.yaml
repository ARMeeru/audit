# Per-stage configuration. Model diversity between Hunt and Validate is
# load-bearing: it implements the blog's "deliberate disagreement" rule.
# Trace runs on Opus because the paper calls it "the stage that matters most."

defaults:
  max_turns: 25
  permission_mode: acceptEdits   # validated at load: bypassPermissions is refused
  repair_attempts: 1             # one re-emit chance on schema-validation failure
  # Run agents under the SDK's OS sandbox (macOS/Linux). This is the boundary
  # between an agent's Bash and the harness's own state.db and results/ tree: a
  # command reaching outside the agent's working directory fails inside the
  # sandbox, so a hunter influenced by the code it is reading cannot forge a
  # finding. runner.py also installs a PreToolUse filter, but a filter over a
  # command string is not a boundary. README's Safety section records what each
  # layer is worth and what the confinement does not cover. Turn this off only
  # where the sandbox cannot start.
  sandbox: true
  # Per-task cost reserved against --max-cost-usd while agents are in flight.
  # Upper bound by intent: 1.5 sits above the highest single task cost ever
  # recorded on the live runs (hunt max $0.676, validate max $1.26,
  # trace max $0.95 across 400+ cost rows). Raise it if a stage moves to a
  # costlier model or max_turns grows; a value below actual per-task cost
  # makes the cap more permissive than committed spend alone.
  est_cost_usd: 1.5

stages:
  recon:
    model: claude-opus-4-7
    concurrency: 1
    # BashOutput and KillShell ride along with Bash: a long compile or test can
    # background on timeout, and without them its output is unreachable.
    tools: [Read, Grep, Glob, Bash, BashOutput, KillShell]
    max_turns: 60                # recon can be long
    repair_attempts: 2           # critical one-shot; spend a second repair turn if needed
  hunt:
    model: claude-sonnet-4-6
    concurrency: 50
    tools: [Read, Grep, Glob, Bash, BashOutput, KillShell]
  validate:
    model: claude-opus-4-7        # different from hunt — deliberate disagreement
    concurrency: 10
    tools: [Read, Grep, Glob]     # no Bash: pure analysis
  gapfill:
    model: claude-sonnet-4-6
    concurrency: 1
    tools: [Read, Grep, Glob]
    repair_attempts: 2
  dedupe:
    model: claude-sonnet-4-6
    concurrency: 1
    tools: [Read]
  trace:
    model: claude-opus-4-7        # most critical stage
    concurrency: 10
    tools: [Read, Grep, Glob, Bash, BashOutput, KillShell]
  feedback:
    model: claude-sonnet-4-6
    concurrency: 1
    tools: [Read, Grep, Glob]
    repair_attempts: 2
  report:
    model: claude-sonnet-4-6
    concurrency: 1
    tools: [Read]

# Bounded loops to prevent runaway cost
loops:
  gapfill_iterations: 2     # max Hunt → Validate → Gapfill cycles
  feedback_iterations: 1    # one feedback pass after Trace
